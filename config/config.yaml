# Smart Intersection — Default Configuration

server:
  host: "0.0.0.0"
  port: 8000
  debug: true

hardware:
  mode: mock  # mock | raspberry
  gpio_pins:
    TL-01:
      red: 17
      yellow: 27
      green: 22
    TL-02:
      red: 23
      yellow: 24
      green: 25

camera:
  mode: simulation  # simulation | usb | file | network
  source: "0"       # 0 = USB cam, or path to video file
  fps: 10
  width: 640
  height: 480

simulation:
  speed: 1.0
  spawn_rate: 0.3

traffic_controller:
  default_green: 30
  default_yellow: 3
  default_red: 30
  min_green: 10
  max_green: 60
  pedestrian_threshold: 5
  pedestrian_weight: 1.3

yolo:
  model: "models/yolov8n.pt"
  confidence: 0.5
  device: "cpu"
  classes: [0, 1, 2, 3, 5, 7]  # person, bicycle, car, motorcycle, bus, truck

storage:
  intersection_config: "config/intersection.json"

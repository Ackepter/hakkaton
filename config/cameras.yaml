# Camera configuration (Task 10-12, 34.9-34.11).
# Every value here can differ between WSL / PC and the Raspberry Pi, so nothing camera related lives in the code.
#
# source:   simulation | usb | file | network | image
# detector: virtual (Simulation Mode default: the simulation reports what it "sees". YOLO is a real photo model
#                    and does NOT recognise the flat-shaded 3D render as car/person - tested: it reads the boxes
#                    as "airplane" and gets filtered out, so forcing "yolo" here silently sees nothing. Task.md
#                    §56 explicitly asks for this virtual channel instead of pointing YOLO at the 3D scene.)
#           yolo    (default for usb/file/network - local YOLO through ultralytics, CPU only)
#                    -> pip install -r requirements-yolo.txt and drop weights at model_path (models/yolov8n.pt)
#           none    (image only, no analysis -> system stays in FAILSAFE)
# zones:    polygons in normalised image coordinates (0..1, origin top-left). Lane zones are counted for vehicles,
#           pedestrian zones for people. A simulation camera generates its zones automatically.
#
# mount:    x, z, height_m, yaw_deg, pitch_deg, fov_deg, range_m describe where a camera hangs and where it looks
#           (metres; yaw = compass bearing 0 = north, pitch = downward tilt, fov = horizontal angle). Leave them out
#           for a default camera mounted beside the west approach, aimed at the junction (one approach's worth of
#           coverage, like a real mast-mounted camera). Give them to a REAL camera (usb, file, network) as well: the
#           lane and crosswalk zones are then projected into its image automatically, exactly as for the virtual
#           camera (measure the mast on the mock-up, no polygons to draw by hand). Add more cameras for full coverage.
#
# A camera is NOT required to start the backend or the Dashboard.

cameras:
  - id: CAM-01
    name: West approach camera (simulation)
    source: simulation
    uri: http://127.0.0.1:8001        # Smart Intersection service (virtual camera output)
    detector: virtual
    x: -30
    z: 0
    height_m: 12
    fov_deg: 55
    range_m: 75
    fps: 5
    width: 640
    height: 480                       # 4:3 like a USB camera
    confidence: 0.5
    timeout_s: 2.0                    # no frame for this long -> camera lost -> FAILSAFE
    reconnect_s: 3.0

  - id: CAM-USB
    name: West approach camera (USB)
    source: usb
    uri: "0"                          # device index, found via discover_usb_cameras
    detector: yolo
    model_path: models/yolov8n.pt
    device: cpu
    imgsz: 320
    # camera must stay enabled: true to exist as a pipeline at all (disabled cameras are skipped entirely,
    # not just disconnected - see build_manager in backend/vision/pipeline.py). Toggle it off from the UI instead.
    x: -30
    z: 0
    height_m: 12
    fov_deg: 55
    range_m: 75
    fps: 5
    width: 640
    height: 480
    confidence: 0.5
    timeout_s: 2.0
    reconnect_s: 3.0

